name: Build BOS Exporter

on:
  workflow_dispatch:
  push:
    branches:
      - bos-exporter

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg-bos
          Set-Location C:\vcpkg-bos
          git checkout 00c5775211f45cd08b37fce0484b4cb940e422ab
          .\bootstrap-vcpkg.bat -disableMetrics
          "VCPKG_ROOT=C:\vcpkg-bos" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset vs2022-ae -DCOPY_BUILD=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset vs2022-ae

      - name: Find built DLL
        shell: pwsh
        run: |
          Get-ChildItem -Path buildae -Recurse -Filter "po3_BaseObjectSwapper.dll"

      - name: Upload DLL
        uses: actions/upload-artifact@v7
        with:
          name: BOS-Exporter-DLL
          path: buildae/**/po3_BaseObjectSwapper.dll
          if-no-files-found: error
